name: build

on:
  repository_dispatch:
    types: [app-build]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  APP_NAME: oscar

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code repo
        uses: actions/checkout@v4
        with:
          repository: c0dem0de/Oscar
          ref: main
          token: ${{ secrets.APP_REPO_READ_TOKEN }}
          path: app


      - name: Backend lint
        uses: astral-sh/ruff-action@v3
        with:
          src: ./app/Backend

      - name: Backend format check
        uses: astral-sh/ruff-action@v3
        with:
          src: ./app/Backend
          args: format --check

      - name: Frontend lint
        working-directory: app/Frontend
        run: |
          npm ci
          npm run lint


      - name: Scan application source with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'app'
          scanners: 'vuln,misconfig,secret'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
          format: 'table'


      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image and tag
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=ghcr.io/${OWNER}/${APP_NAME}" >> "$GITHUB_ENV"
          echo "TAG=main-$(git -C app rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: app/Backend
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}-backend:${{ env.TAG }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: app/Frontend
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}-frontend:${{ env.TAG }}

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.IMAGE }}-backend:${{ env.TAG }}
          scanners: 'vuln,secret'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
          format: 'table'

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          scan-type: 'image'
          image-ref: ${{ env.IMAGE }}-frontend:${{ env.TAG }}
          scanners: 'vuln,secret'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
          format: 'table'

      - name: Checkout infra repo
        uses: actions/checkout@v4
        with:
          path: infra

      - name: Bump image tags
        working-directory: infra
        run: |
          sed -i -E "s|(tag: )main-.*|\1${TAG}|" charts/oscar/values.yaml
          git config user.name ci-bot
          git config user.email ci-bot@users.noreply.github.com
          git commit -am "deploy: ${TAG}"
          git push
