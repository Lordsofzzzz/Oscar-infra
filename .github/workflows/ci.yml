name: build

on:
  repository_dispatch:
    types: [app-build]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  APP_NAME: oscar

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code repo
        uses: actions/checkout@v4
        with:
          repository: c0dem0de/Oscar
          ref: main
          token: ${{ secrets.APP_REPO_READ_TOKEN }}
          path: app

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image and tag
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=ghcr.io/${OWNER}/${APP_NAME}" >> "$GITHUB_ENV"
          echo "TAG=main-$(git -C app rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: app/Backend
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}-backend:${{ env.TAG }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: app/Frontend
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}-frontend:${{ env.TAG }}
