apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: oscar
  namespace: flux-system
spec:
  interval: 10m
  targetNamespace: oscar
  # Pin this so resources are named oscar-frontend/oscar-backend,
  # matching the upstream hardcoded in the frontend image's nginx config.
  releaseName: oscar
  chart:
    spec:
      # chart committed in this same repo, rendered from the flux-system GitRepository
      chart: ./charts/oscar
      sourceRef:
        kind: GitRepository
        name: flux-system
